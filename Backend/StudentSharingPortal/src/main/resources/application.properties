# Application Configuration
spring.application.name=StudentSharingPortal

# MySQL DataSource
spring.datasource.url=jdbc:mysql://localhost:3306/student_portal?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# File Upload
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
file.upload-dir=./uploads

# JWT
jwt.secret=StudyPortalSecretKey2024VeryLongSecretKeyForJWTSigning
jwt.expiration=86400000

# Server
server.port=8080
